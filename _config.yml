title: Apache Wicket
description: "Apache Wicket is a component-oriented, type-safe Java web application framework. Production-proven for over twenty years."
url: "https://wicket.apache.org"
baseurl: ""

# Hero configuration
# Switch between hero themes:
#   borobudur: Borobudur temple (Java, Indonesia) — "stand the test of time"
#   java-developer: Java Developer job posting in cornfield — "the Java way"
hero:
  image: /img/hero-borobudur.jpg
  tagline: "Java web applications"
  tagline_emphasis: "that stand the test of time."
  credit_name: "Mario La Pergola"
  credit_url: "https://unsplash.com/@mlapergolaphoto"
  photo_url: "https://unsplash.com/photos/WTGV6qBOzro"

# Wicket-specific configuration
wicket:
  version: "10.8.0"
  version90: "9.22.0"
  version80: "8.17.0"
  released: "2025-12-30"
  java_baseline: "17"
  versions:
    - branch: "10.x"
      version: "10.8.0"
      status: "current, supported"
      java: "17+"
    - branch: "9.x"
      version: "9.22.0"
      status: "supported"
      java: "11+"
    - branch: "8.x"
      version: "8.17.0"
      status: "security fixes only"
      java: "8+"
  archetype:
    group_id: "org.apache.wicket"
    artifact_id: "wicket-archetype-quickstart"
  live_examples_url: "https://examples10x.wicket.apache.org/"
  guide_base_url: "https://nightlies.apache.org/wicket/guide"
  javadoc_base_url: "https://nightlies.apache.org/wicket/apidocs"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge

# Pagination
pagination:
  enabled: true
  per_page: 10
  permalink: "/page/:num/"

# Navigation
navigation:
  - text: "Get Started"
    href: "/start/quickstart"
  - text: "Documentation"
    href: "/docs"
  - text: "Community"
    href: "/community"
  - text: "Blog"
    href: "/blog"
  - text: "GitHub"
    href: "https://github.com/apache/wicket"
    external: true

# Collections
collections:
  docs:
    output: true
    permalink: /docs/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "blog-post"
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "docs"
  - scope:
      path: ""
    values:
      layout: "default"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - scripts
  - history
  - "*.sh"
  - README.md
