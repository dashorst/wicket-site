name: Apache Wicket
description: Apache Wicket is a component-oriented Java web framework for complex, dynamic pages in plain Java and plain HTML, without a JavaScript build chain.
destination: ./content
lsi:         false
port: 4000
highlighter:    rouge
markdown:    Kramdown
monthly_archive:
    path:   news
    layout: news_archive
yearly_archive:
    layout: news_archive
permalink:   news/:year/:month/:day/:title.html
exclude:      [readme.md, PRODUCT.md, DESIGN.md, .impeccable, .previews]
excerpt_separator: <!--more-->
contentsLabel: On this page
sass:
    sass_dir: _sass
wicket:
  version:    11.0.0
  version_11: 11.0.0
  version_90: 9.24.0
  version_10: 10.11.0
  version_80: 8.19.0
  version_70: 7.18.0
  version_60: 6.30.0
  version_15: 1.5.16
  version_14: 1.4.23
  version_13: 1.3.7
  released:   2026-10-04
  versions:   [6.30.0, 1.5.16, 1.4.23, 7.18.0, 8.19.0, 9.24.0, 10.11.0, 11.0.0, 10.12.0-SNAPSHOT, 12.0.0-SNAPSHOT]

live_examples_url: http://examples10x.wicket.apache.org/

navigation:
- id: start
  text: Quick Start
  url: /start/quickstart.html
- id: download
  text: Download
  url: /start/download.html
- id: documentation
  text: Documentation
  url: /learn
- id: support
  text: Support
  url: /help
- id: contribute
  text: Contribute
  url: /contribute
- id: community
  text: Community
  url: /community
- id: apache
  text: Apache
  url: /apache

