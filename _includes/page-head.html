{% comment %} The title band of reading pages: title, subtitle, and the date of a news post. {% endcomment %}
<header class="page-head">
    <div class="page-head-in">
        {% if page.collection == 'posts' %}<p class="page-kicker"><a href="{{ site.baseurl }}/news/">News</a> <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>{% endif %}
        <h1>{{ page.title }}</h1>
        {% if page.subtitle %}<p class="page-sub">{{ page.subtitle }}</p>{% endif %}
    </div>
</header>
