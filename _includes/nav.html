<nav class="site-nav">
  <div class="site-nav-inner">
    <a href="/" class="site-nav-brand">
      <div class="site-nav-logo">W</div>
      <span class="site-nav-title">Apache Wicket</span>
    </a>
    <button class="site-nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="site-nav-links">
      {% for item in site.navigation %}
      <a href="{{ item.href }}"
         class="site-nav-link{% if page.url contains item.href %} active{% endif %}"
         {% if item.external %}target="_blank" rel="noopener noreferrer"{% endif %}>
        {{ item.text }}{% if item.external %} <span class="site-nav-external-icon">&nearr;</span>{% endif %}
      </a>
      {% endfor %}
    </div>
  </div>
</nav>
