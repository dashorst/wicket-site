---
layout: base
---
<section class="header-band">
  <div class="header-band-inner">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
    {% if page.preamble %}<p class="preamble">{{ page.preamble }}</p>{% endif %}
  </div>
</section>
<main class="content-area">
  <div class="content-inner prose">
    {{ content }}
  </div>
</main>
