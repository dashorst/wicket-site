---
---
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% if page.title %}{{ page.title }} | {% endif %}Apache Wicket</title>
        <meta name="description" content="{{ page.description | default: page.preamble | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
        <meta name="theme-color" content="#0c0c0c">
        <meta name="color-scheme" content="dark">
        <link rel="icon" href="{{ site.baseurl }}/img/logo-apachewicket-mark.svg" type="image/svg+xml">
        <link rel="alternate icon" href="{{ site.baseurl }}/favicon.ico" type="image/vnd.microsoft.icon">
        <link rel="alternate" type="application/atom+xml" title="Apache Wicket news" href="{{ site.baseurl }}/atom.xml">
        <link rel="preload" href="{{ site.baseurl }}/fonts/schibsted-grotesk/schibsted-grotesk-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
        <link rel="preload" href="{{ site.baseurl }}/fonts/schibsted-grotesk/schibsted-grotesk-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
        {% comment %} The build time in the URL makes every deploy fetch fresh files despite cache headers. {% endcomment %}
        <link rel="stylesheet" href="{{ site.baseurl }}/css/style.css?v={{ site.time | date: '%s' }}">
    </head>
    <body class="{{ page.pageclasses }}">
        <a class="skip" href="#main">Skip to content</a>
        {{ content }}
        {% include footer.html %}
        <script src="{{ site.baseurl }}/javascript/reveal.js?v={{ site.time | date: '%s' }}" defer></script>
    </body>
</html>
