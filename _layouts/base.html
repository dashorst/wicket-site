<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <!-- Favicon -->
  <link rel="icon" href="{{ site.baseurl }}/favicon.ico" sizes="16x16">
  <link rel="icon" href="{{ site.baseurl }}/img/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ site.baseurl }}/img/logo.svg">

  <!-- Fonts loaded locally — no external CDN requests -->

  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">

  <!-- Atom Feed -->
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ site.baseurl }}/feed.xml">
</head>
<body>
  {% include asf-bar.html %}
  {% include nav.html %}
  {{ content }}
  {% include footer.html %}
</body>
</html>
